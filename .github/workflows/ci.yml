name: CI

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python local and hosted
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            constraints.txt
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt -r requirements-hosted.txt
          python -m pip check
      - run: python -m pytest -q

  postgres:
    name: PostgreSQL concurrency and restore
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: python:3.12-bookworm
    services:
      postgres:
        image: postgres:15-bookworm
        env:
          POSTGRES_USER: annotation_ci
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: annotation_ci
        options: >-
          --health-cmd "pg_isready -U annotation_ci -d annotation_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ANNOTATION_TEST_DATABASE_URL: postgresql+psycopg://annotation_ci:disposable-ci-password@postgres:5432/annotation_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install matching PostgreSQL tools and test dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends postgresql-client-15
          python -m pip install -r requirements-hosted.txt pytest==9.1.1
      - name: Run every PostgreSQL integration check
        shell: bash
        run: |
          set -euo pipefail
          dsn_file="$RUNNER_TEMP/postgres-test-dsn"
          (umask 077; printf '%s' "$ANNOTATION_TEST_DATABASE_URL" > "$dsn_file")
          export ANNOTATION_TEST_POSTGRES_URL_FILE="$dsn_file"
          trap 'rm -f "$dsn_file"' EXIT
          python -m pytest -q tests/test_hosted_concurrency.py tests/test_maintenance.py::test_postgres_exported_snapshot_roundtrip

  frontend:
    name: Frontend and mask compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - run: node --experimental-strip-types --test tests/frontend-masks.mjs

  hosted-image:
    name: CPU hosted image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker build --file Dockerfile.hosted --tag annotation-hosted:ci .
      - name: Check CPU-only runtime
        run: >-
          docker run --rm --entrypoint python annotation-hosted:ci -c
          "import importlib.util; import app.hosted.main, app.hosted.dispatcher, app.hosted.maintenance; assert importlib.util.find_spec('torch') is None"

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash .github/scripts/scan-secrets.sh

  required:
    name: Required checks
    if: always()
    needs: [python, postgres, frontend, hosted-image, secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              raise SystemExit('Required jobs did not pass: ' + ', '.join(failed))
          PY
